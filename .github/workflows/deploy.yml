name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Daily, for the rehearsal log's LeetCode snapshot. An odd minute, because
  # GitHub may delay or drop scheduled runs at the top of the hour.
  schedule:
    - cron: '17 21 * * *' # 02:17 in Lahore

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Astro 7 needs Node 22.23.4 or newer; runner images may cache an older 22.x.
          node-version: 24
          cache: npm
      - run: node --version && npm ci

      # Never fails the build: if LeetCode is unreachable, the last snapshot stays.
      - name: Refresh the LeetCode snapshot
        if: github.event_name != 'pull_request'
        run: node scripts/fetch-leetcode.mjs

      # Only the daily run commits, so pushes don't trigger a commit of their own. Committing
      # also counts as activity, which keeps GitHub from switching the schedule off after 60 quiet days.
      - name: Commit the snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git diff --quiet -- src/data/leetcode.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/leetcode.json
          git commit -m 'Update the rehearsal log'
          git push

      - name: Unit tests
        run: npm test
      - name: Type check and build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
